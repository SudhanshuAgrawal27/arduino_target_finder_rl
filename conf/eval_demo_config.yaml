# Config for eval_demo_16-16-ldr-feedback.py, which runs a single demo
# episode from a chosen checkpoint while mirroring it live onto the 16x16
# LED matrix.
#   python3 eval_demo_16-16-ldr-feedback.py
# Override checkpoint_dir/seed to demo a different run/episode.

defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

checkpoint_dir: trained_models/h64_l3_hist4_ep150_seed43/epoch_150
seed: 800

led_port: /dev/ttyUSB0
led_baud: 115200
step_delay_seconds: 1.0

# How far outside the subgrid (in global-board cells) the blinking boundary
# outline is drawn, so it doesn't overlap the playable area itself.
boundary_margin: 1

# Whether the perfect-world run briefly lights the 4 candidate next cells in
# yellow (scaled by policy probability) before each move -- see
# show_thinking() in eval_demo_16-16-ldr-feedback.py. Purely cosmetic; the
# real LDR-driven run never shows this regardless of this setting (it must
# not reveal anything beyond its own sensor reading).
show_thinking: false

# How long to wait for the LDR to settle before each read -- reused for the
# once-per-game ambient baseline and every per-step reading. Should match
# whatever --linger-seconds was used for `python3 eval_ldr_sweep.py
# --calibrate`, since the calibration curve it produced is only a valid
# reference if live readings settle for the same duration.
ldr_linger_seconds: 0.25

# Path to the JSON produced by `python3 eval_ldr_sweep.py --calibrate` --
# see that script for what it contains (a delta-vs-distance curve used to
# turn live LDR readings into the policy's trained discrete proximity
# levels).
ldr_calibration_file: ldr_calibration.json
