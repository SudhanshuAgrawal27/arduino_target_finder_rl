# Accelerate launch config for this project. Pass it explicitly:
#   accelerate launch --config_file conf/accelerate.yaml train.py
#
# Single-process, CPU-pinned: the model is a tiny MLP and rollout collection
# is serial, so the GPU buys nothing here. Flip use_cpu to false if the
# network is ever scaled up enough to be GPU-bound.
compute_environment: LOCAL_MACHINE
distributed_type: "NO"
num_processes: 1
machine_rank: 0
use_cpu: true
mixed_precision: "no"
