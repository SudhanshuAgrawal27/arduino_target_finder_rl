# Real training-run config. Use it with:
#   python3 train.py --config-name config_train
#   accelerate launch --config_file conf/accelerate.yaml train.py --config-name config_train
# Any field is still overridable on the command line, e.g. training.num_epochs=100

defaults:
  - override hydra/job_logging: disabled  # we do our own logging via accelerator.print
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .              # we manage our own run directory (trained_models/<run_name>/)
  output_subdir: null

seed: 42

env:
  grid_size: 16
  subgrid_size: 8
  score_radius: 2
  max_steps: 100
  history_length: 4
  step_penalty: 0.01     # reward cost per step onto an empty (proximity-0) cell
  success_bonus: 1.0     # terminal reward for reaching the target

network:
  hidden_dim: 128        # bumped from 64 (config.yaml): search over a 4-step window needs more capacity

ppo:
  gamma: 0.99            # discount factor, matches max_steps horizon (standard)
  lam: 0.95              # GAE lambda (standard)
  clip_eps: 0.2          # PPO ratio clip range [1-clip_eps, 1+clip_eps] (standard)
  value_coef: 0.5        # weight on the value loss term (standard)
  entropy_coef: 0.01     # PPO standard: reward is now a dense proximity gradient (not sparse), so the
                         # policy no longer needs extra exploration to stumble onto the target -- and lower
                         # entropy lets the greedy policy commit, which is what the reward redesign targets
  learning_rate: 3.0e-4  # PPO default; linearly annealed down to 10% over training.num_epochs (see train.py)
  update_epochs: 4       # gradient-update passes over each collected batch (standard)
  minibatch_size: 1024   # bumped from 256: keeps updates/epoch reasonable given the larger batch size
  max_grad_norm: 0.5     # global grad-norm clip per update step (standard PPO stability safeguard)

training:
  num_epochs: 150            # bumped from 100: LR now decays over training, and train curves
                               # hadn't clearly plateaued by epoch 100 under the old constant LR
  episodes_per_epoch: 1000   # one epoch = 1000 simulations (task definition)
  eval_episodes: 100         # eval + baseline + val-loss episodes, run every epoch
  eval_seed: 999              # fixed seed so eval/baseline/val replay the same episodes every epoch

output:
  base_dir: trained_models
  run_name: null  # null = auto timestamp; set to name a run explicitly

wandb:
  project: grid-search-rl
  mode: online  # uploads live to your wandb.ai account -- run `wandb login` first
