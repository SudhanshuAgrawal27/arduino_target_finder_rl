# Config for the standalone eval_fixed_dataset.py. Override checkpoint_dir on
# the command line to point at any checkpoint, e.g.:
#   python3 eval_fixed_dataset.py checkpoint_dir=trained_models/2026-07-06_14-30-05/epoch_1
#
# Unlike eval_random.py (fresh seeded episodes), this replays the same fixed,
# categorized 100-instance dataset (eval_fixed_dataset.json) every time, so
# checkpoints are compared on identical problems and broken down by
# difficulty category.

defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

checkpoint_dir: trained_models/2026-07-07_05-01-02/epoch_20
dataset_path: eval_fixed_dataset.json
